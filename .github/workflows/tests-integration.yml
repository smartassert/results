name: tests-integration

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  integration:
    name: Integration tests - PHP ${{ matrix.php }}
    strategy:
      matrix:
        operating-system: [ubuntu-latest]
        php: ['8.5', '8.6']
    runs-on: ${{ matrix.operating-system }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup php
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Set PHP version in Dockerfile
        run: |
          sed -i 's/8.5-fpm/${{ matrix.php }}-fpm/g' Dockerfile
          cat Dockerfile        

      - name: Pull images
        run: composer integration-pull

      - name: Setup integration environment
        env:
          DATABASE_URL: postgres://postgres:password!@127.0.0.1:5432/results?charset=UTF-8
        run: composer integration-setup

      - name: Verify integration environment state
        env:
          DATABASE_URL: postgres://postgres:password!@127.0.0.1:5432/results?charset=UTF-8
        run: |
          composer integration-status
          sleep 10

      - name: Run tests
        run: composer test-integration
